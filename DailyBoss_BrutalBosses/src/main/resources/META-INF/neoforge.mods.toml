modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
[[mixins]]
config = "dailyboss_brutal_bosses.mixins.json"
[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="pladailyboss"
    mandatory=true
    versionRange="[1.5, )"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="brutalbosses"
    mandatory=true
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"